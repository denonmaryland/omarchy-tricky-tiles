<svg xmlns="http://www.w3.org/2000/svg" width="620" height="150" viewBox="0 0 620 150" role="img" aria-label="Tricky Tiles">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7AA2F7"/><stop offset="1" stop-color="#BB9AF7"/></linearGradient>
  </defs>
  <!-- two tiles mid-switch: the arriving one overshoots a little, as a spring does -->
  <g transform="translate(34,40)">
    <rect x="0" y="0" width="52" height="70" rx="8" fill="#1E2330" stroke="#3A4152" stroke-width="2"/>
    <rect x="66" y="0" width="52" height="70" rx="8" fill="url(#g)" opacity="0.95"/>
    <path d="M-6 92 C 20 92, 28 18, 46 18 S 72 44, 90 36 S 118 20, 140 24" fill="none" stroke="#7AA2F7" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
    <circle cx="140" cy="24" r="3.5" fill="#BB9AF7"/>
  </g>
  <text x="230" y="84" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="58" font-weight="700" letter-spacing="-2" fill="#E6E8EE">Tricky Tiles</text>
  <text x="232" y="116" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" fill="#9AA3B2">Springs for every window and workspace switch.</text>
</svg>
